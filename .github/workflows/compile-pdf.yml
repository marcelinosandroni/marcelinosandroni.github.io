name: Compile & Publish Resume PDFs

# Reusable, and callable by hand.
#
# This used to trigger on `push: tags: v*.*.*`, which meant it could only ever
# fire if a human or a bot pushed a tag. GitHub deliberately does not trigger
# new workflow runs from actions performed with `GITHUB_TOKEN`, and
# semantic-release pushes the tag with exactly that token — so the release
# created v1.0.0, and this workflow never started. It has now never run once:
# it was added on 2026-09-07, after the only other tag.
#
# Folding the build into the release as a called workflow removes the
# cross-workflow trigger entirely. No personal access token is required, and
# there is no way for the tag and the artifacts to disagree.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to build for, without the leading v"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for, without the leading v. Defaults to package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  compile-pdf:
    name: Compile Resume PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build deterministic LaTeX compiler
        run: docker build --target pdf-compiler --tag marcelino-pdf-compiler:latest --file Dockerfile.latex .

      - name: Compile PDFs
        run: npm run compile:pdf

      - name: Resolve version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            # A manual run with no input rebuilds whatever package.json says,
            # which is the current release after semantic-release bumps it.
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building PDFs for v${VERSION}"

      - name: List compiled artifacts
        run: ls -lah public/artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          # Not `github.ref`: this runs on a branch or on `main`, not on a tag,
          # so the tag has to be named explicitly. Without it the assets land
          # nowhere.
          tag_name: v${{ steps.version.outputs.version }}
          files: public/artifacts/*.pdf
          draft: false
          prerelease: false

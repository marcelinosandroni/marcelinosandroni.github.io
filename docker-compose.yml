services:
  app:
    image: resume-platform:dev
    build:
      context: .
      target: development
    pull_policy: if-not-present
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-anon-key}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    pull_policy: if-not-present
    environment:
      POSTGRES_DB: resume
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  e2e:
    profiles: ["e2e"]
    image: resume-platform:dev
    build:
      context: .
      target: development
    pull_policy: if-not-present
    environment:
      BASE_URL: http://app:3000
    depends_on:
      - app
    command: npm run test:e2e

volumes:
  postgres_data:
